<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Export Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-canvas {
            width: 400px;
            height: 300px;
            border: 2px solid #ddd;
            background: white;
            position: relative;
            margin: 20px 0;
        }
        .test-shape {
            position: absolute;
            background: #e3f2fd;
            border: 2px solid #1976d2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #1976d2;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .log {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🧪 Simple Export Test</h1>
    
    <div class="test-canvas" id="testCanvas" class="react-flow">
        <div class="test-shape react-flow__node" style="left: 50px; top: 50px; width: 100px; height: 60px;">
            Rectangle
        </div>
        <div class="test-shape react-flow__node" style="left: 200px; top: 100px; width: 80px; height: 80px; border-radius: 50%;">
            Circle
        </div>
        <div class="test-shape react-flow__node" style="left: 100px; top: 180px; width: 120px; height: 40px; border-radius: 20px;">
            Process
        </div>
    </div>

    <div>
        <button onclick="testBasicPNG()">Test Basic PNG</button>
        <button onclick="testCanvasExport()">Test Canvas Export</button>
        <button onclick="testHTML2Canvas()">Test HTML2Canvas</button>
        <button onclick="checkLibraries()">Check Libraries</button>
        <button onclick="testFlowDigmExport()">Test FlowDigm Export</button>
    </div>

    <div class="log" id="log">Ready for testing...<br></div>

    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function testBasicPNG() {
            log('🧪 Testing basic PNG export with native canvas...');
            
            try {
                // Create a simple canvas
                const canvas = document.createElement('canvas');
                canvas.width = 400;
                canvas.height = 300;
                const ctx = canvas.getContext('2d');
                
                // Draw background
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 400, 300);
                
                // Draw test shapes
                ctx.fillStyle = '#e3f2fd';
                ctx.strokeStyle = '#1976d2';
                ctx.lineWidth = 2;
                
                // Rectangle
                ctx.fillRect(50, 50, 100, 60);
                ctx.strokeRect(50, 50, 100, 60);
                
                // Circle
                ctx.beginPath();
                ctx.arc(240, 140, 40, 0, 2 * Math.PI);
                ctx.fill();
                ctx.stroke();
                
                // Text
                ctx.fillStyle = '#1976d2';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Test Export', 200, 250);
                
                // Export as PNG
                const dataURL = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = 'basic-test.png';
                link.href = dataURL;
                link.click();
                
                log('✅ Basic PNG export successful');
                
            } catch (error) {
                log(`❌ Basic PNG export failed: ${error.message}`);
            }
        }

        function testCanvasExport() {
            log('🎯 Testing canvas element export...');
            
            try {
                const testElement = document.getElementById('testCanvas');
                if (!testElement) {
                    log('❌ Test canvas element not found');
                    return;
                }
                
                log('✅ Test canvas element found');
                log(`Canvas dimensions: ${testElement.offsetWidth}x${testElement.offsetHeight}`);
                
                // Try using html2canvas if available
                if (typeof html2canvas === 'function') {
                    log('🔄 Using html2canvas...');
                    html2canvas(testElement).then(canvas => {
                        const link = document.createElement('a');
                        link.download = 'canvas-test.png';
                        link.href = canvas.toDataURL();
                        link.click();
                        log('✅ Canvas export with html2canvas successful');
                    }).catch(error => {
                        log(`❌ html2canvas failed: ${error.message}`);
                    });
                } else {
                    log('❌ html2canvas not available');
                }
                
            } catch (error) {
                log(`❌ Canvas export failed: ${error.message}`);
            }
        }

        async function testHTML2Canvas() {
            log('📦 Testing html2canvas availability...');
            
            try {
                // Try to load html2canvas from CDN for testing
                if (typeof html2canvas === 'undefined') {
                    log('🔄 Loading html2canvas from CDN...');
                    const script = document.createElement('script');
                    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                    script.onload = () => {
                        log('✅ html2canvas loaded from CDN');
                        testHTML2CanvasExport();
                    };
                    script.onerror = () => {
                        log('❌ Failed to load html2canvas from CDN');
                    };
                    document.head.appendChild(script);
                } else {
                    log('✅ html2canvas already available');
                    testHTML2CanvasExport();
                }
                
            } catch (error) {
                log(`❌ html2canvas test failed: ${error.message}`);
            }
        }

        function testHTML2CanvasExport() {
            const testElement = document.getElementById('testCanvas');
            
            html2canvas(testElement, {
                backgroundColor: '#ffffff',
                scale: 1,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'html2canvas-test.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                log('✅ html2canvas export successful');
            }).catch(error => {
                log(`❌ html2canvas export failed: ${error.message}`);
            });
        }

        function checkLibraries() {
            log('📚 Checking export libraries availability...');
            
            const libraries = [
                'html2canvas',
                'jspdf',
                'PptxGenJS',
                'domtoimage'
            ];
            
            libraries.forEach(lib => {
                const available = typeof window[lib] !== 'undefined';
                log(`${lib}: ${available ? '✅ Available' : '❌ Not Available'}`);
            });
            
            // Check if FlowDigm export functions are available
            log('🔍 Checking FlowDigm export functions...');
            
            const flowdigmFunctions = [
                'exportFile',
                'exportCanvas',
                '__CANVAS_CONTEXT__',
                '__REACT_FLOW_INSTANCE__'
            ];
            
            flowdigmFunctions.forEach(func => {
                const available = typeof window[func] !== 'undefined' || window[func] !== undefined;
                log(`window.${func}: ${available ? '✅ Available' : '❌ Not Available'}`);
            });
        }

        async function testFlowDigmExport() {
            log('🚀 Testing FlowDigm export functions...');
            
            try {
                // Check if we're in the FlowDigm context
                if (typeof window.exportFile === 'function') {
                    log('✅ window.exportFile found - testing PNG export...');
                    
                    await window.exportFile('png', 'flowdigm-test', {
                        quality: 1.0,
                        scale: 1,
                        backgroundColor: '#ffffff'
                    });
                    
                    log('✅ FlowDigm exportFile PNG test successful');
                    
                } else if (window.__CANVAS_CONTEXT__ && typeof window.__CANVAS_CONTEXT__.exportCanvas === 'function') {
                    log('✅ Canvas context export found - testing PNG export...');
                    
                    await window.__CANVAS_CONTEXT__.exportCanvas('png');
                    
                    log('✅ FlowDigm canvas context export test successful');
                    
                } else {
                    log('❌ FlowDigm export functions not found');
                    log('ℹ️ Make sure you are running this test in the FlowDigm application');
                }
                
            } catch (error) {
                log(`❌ FlowDigm export test failed: ${error.message}`);
                console.error('FlowDigm export error:', error);
            }
        }

        // Auto-check libraries on load
        window.addEventListener('load', () => {
            log('🔄 Page loaded - running initial checks...');
            checkLibraries();
        });
    </script>
</body>
</html>
